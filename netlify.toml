[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"

# The API is a long-running Express process and does not exist on Netlify.
# This rule must come first: without it the catch-all below would answer
# /api/inquiries with index.html and a 200, and the quote form would report
# success for a request nobody received.
[[redirects]]
  from = "/api/*"
  to = "/index.html"
  status = 404

# Single-page app: every route is rendered by the client, so any path that is
# not a real file has to be served index.html. Without this, /piese/coltar-aldo
# works when reached in-app — the router handles it — but a direct visit or a
# refresh asks Netlify for a file that was never built, and gets a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite hashes these filenames, so they can never change under the same name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# Media filenames are stable, not hashed: hero.mp4 stays hero.mp4 when the clip
# is re-encoded. Marking it immutable would leave returning visitors on a
# year-stale file, so it revalidates in the background instead.
[[headers]]
  for = "/media/*"
  [headers.values]
    cache-control = "public, max-age=604800, stale-while-revalidate=86400"

# Catalogue detail, fetched when a piece is opened. The filename is the slug, so
# a re-shot piece keeps it — and a week of cache meant a deploy that changed the
# photography did not reach anyone who had opened the page before. These are a
# few kilobytes each: revalidate every time and let the ETag answer.
[[headers]]
  for = "/data/*"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
