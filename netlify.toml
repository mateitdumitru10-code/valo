[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"

# The API is a long-running Express process and does not exist on Netlify.
# An unknown address already gets 404.html and a 404; this says so
# explicitly, so the quote form can never read a 200 for a request nobody
# received.
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

# Every page is prerendered to its own file (scripts/prerender.mjs), so there
# is no catch-all to index.html: it answered addresses that do not exist with
# the home page and a 200. Netlify serves 404.html for anything not built.

# Vite hashes these filenames, so they can never change under the same name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# Media filenames are stable, not hashed: hero.mp4 stays hero.mp4 when the clip
# is re-encoded. Marking it immutable would leave returning visitors on a
# year-stale file, so it revalidates in the background instead.
[[headers]]
  for = "/media/*"
  [headers.values]
    cache-control = "public, max-age=604800, stale-while-revalidate=86400"

# Catalogue detail, fetched when a piece is opened. The filename is the slug, so
# a re-shot piece keeps it — and a week of cache meant a deploy that changed the
# photography did not reach anyone who had opened the page before. These are a
# few kilobytes each: revalidate every time and let the ETag answer.
[[headers]]
  for = "/data/*"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
